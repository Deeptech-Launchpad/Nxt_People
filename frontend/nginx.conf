# Production nginx config baked into the frontend image.
#
# Responsibilities:
#   • Serve the Vite-built SPA from /usr/share/nginx/html
#   • Reverse-proxy /api/  → backend:5000  (Express)
#   • Reverse-proxy /uploads/ → backend:5000  (Express static)
#   • SPA fallback so deep links work (try_files → index.html)
#
# The upstream `backend` is the Docker Compose service name and is resolved
# via Docker's internal DNS. This config is identical in dev-compose and
# prod-compose; only TLS / port exposure / env vars differ.

upstream nxt_backend {
  server backend:5000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Generous body size — profile pictures and uploaded ID proofs go through
  # /api/* (multer), so the limit must cover them.
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # API — never cached, never falls through to the SPA.
  location /api/ {
    proxy_pass         http://nxt_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 60s;
  }

  # WebSocket endpoint for the real-time chat. Needs Upgrade/Connection
  # headers to negotiate the protocol switch, and a long read timeout so
  # idle connections aren't killed mid-conversation (browser/server pings
  # keep it alive in the background).
  location /ws/chat {
    proxy_pass         http://nxt_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Uploaded files (resumes, profile photos, ID docs). Served by Express
  # static middleware so auth-aware headers stay consistent.
  location /uploads/ {
    proxy_pass         http://nxt_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
  }

  # Hashed bundle assets — safe to cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA entry — never cache index.html or react-router will serve stale shells.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
