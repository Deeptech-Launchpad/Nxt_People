<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Layered ocean waves">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062c38"/>
      <stop offset="100%" stop-color="#0e4c5c"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd3d8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bdeef0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7fd3d8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#water)"/>

  <!-- Each swell is the same curve shifted and lightened, so they read as one
       body of water catching light rather than as separate stripes. -->
  <path d="M0 210 C 220 168, 420 254, 640 212 S 1060 168, 1280 214 S 1520 252, 1600 224 L1600 400 L0 400 Z"
        fill="#126174" opacity="0.85"/>
  <path d="M0 262 C 200 224, 430 302, 660 262 S 1080 220, 1300 266 S 1530 300, 1600 276 L1600 400 L0 400 Z"
        fill="#1a7c8f" opacity="0.85"/>
  <path d="M0 316 C 240 282, 440 350, 680 314 S 1100 276, 1320 318 S 1540 348, 1600 330 L1600 400 L0 400 Z"
        fill="#2a9aa8" opacity="0.9"/>
  <path d="M0 366 C 260 340, 470 392, 700 364 S 1120 332, 1340 368 L1600 356 L1600 400 L0 400 Z"
        fill="#48b8be"/>

  <path d="M0 210 C 220 168, 420 254, 640 212 S 1060 168, 1280 214 S 1520 252, 1600 224"
        fill="none" stroke="url(#crest)" stroke-width="2.5"/>
</svg>
