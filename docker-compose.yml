services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: nxt_people
    # No host port binding — backend reaches db via Docker internal network only.
    # This avoids conflict with any host-level PostgreSQL on port 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nxt_people"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=nxt_people
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - COMPANY_NAME=${COMPANY_NAME:-Nxt People}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_ALLOWED_DOMAINS=${GOOGLE_ALLOWED_DOMAINS:-altiusnxt.com}
      # Zoho People sync. These were missing entirely: the backend reads them
      # through dotenv, but .dockerignore keeps backend/.env out of the image
      # and this list never passed them in, so the container saw none of them.
      # Sync failed on ZOHO_API_DOMAIN only because zohoApi() happens to read
      # that one first — the other four were equally absent. Values come from
      # the project-root .env, alongside every other ${...} above.
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN}
      - ZOHO_API_DOMAIN=${ZOHO_API_DOMAIN:-https://people.zoho.in}
      - ZOHO_AUTH_URL=${ZOHO_AUTH_URL:-https://accounts.zoho.in/oauth/v2/token}
      - ZOHO_DEFAULT_COMPANY=${ZOHO_DEFAULT_COMPANY:-}
      - ZOHO_PAYROLL_FORM=${ZOHO_PAYROLL_FORM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Bind only to loopback so the host nginx reverse-proxy (which listens on
    # the public interface) forwards to this container at port 3006.
    ports:
      - "127.0.0.1:3006:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
