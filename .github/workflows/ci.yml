name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ── Backend: lint + tests (Jest + supertest against a temporary Postgres) ──
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nxt_people_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres -d nxt_people_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: nxt_people_test
      JWT_SECRET: ci-test-secret-${{ github.run_id }}
      JWT_ACCESS_EXPIRE: 15m

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Run migrations against the test DB
        run: node migrate.js

      - name: Seed sample data
        run: npm run seed || echo "seed step skipped"

      # Creates admin@nxtpeople.com / sarah@nxtpeople.com / michael@nxtpeople.com
      # with bcrypt('password123'). Tests log in as these users, so this MUST
      # succeed before Jest runs (no silent fallback).
      - name: Ensure test users exist
        run: npm run test:setup

      - name: Run Jest
        run: npm test -- --runInBand --forceExit

  # ── Frontend: lint + production build ────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Lint runs across both halves of the monorepo ─────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install root ESLint deps
        run: npm install --no-save eslint@^8 eslint-plugin-react@^7 eslint-config-prettier@^9
      - name: Run ESLint
        run: npx eslint "frontend/src/**/*.{js,jsx}" "backend/**/*.js" --ignore-pattern "**/node_modules/**" --ignore-pattern "**/dist/**" --max-warnings=200
        continue-on-error: true  # warnings don't fail the build yet — flip to false after a clean-up pass
